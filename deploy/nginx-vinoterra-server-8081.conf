# СНИМОК того, что реально установлено на сервере (обновлён 28.08.2026).
# Канонический конфиг для домена — nginx-vino-terra.conf; этот файл описывает
# фактическую установку: порт 8081, каталог /opt/vinoterra-web, SPA-заглушка.
# Порт 80 на той же машине занят неродственным сайтом domrealt.
# Установлен как /etc/nginx/sites-available/vinoterra (symlink в sites-enabled).

server {
    listen 8081;
    listen [::]:8081;

    server_name _;

    root /opt/vinoterra-web/frontend;
    index index.html;

    # --- Служебные файлы не отдаём -------------------------------------------
    # Веб-корень чистый (только фронтенд), но рядом с HTML лежат data/build.py
    # и CONTRIBUTING.md, а сканеры круглосуточно перебирают имена вроде
    # .aws/credentials и config.json.old. Исключение для /.well-known/ через
    # ^~ обязательно: иначе Certbot не выпустит сертификат для домена.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(py|pyc|md|sh|bak|log|env|sqlite3?|db|yml|yaml|ini|toml)$ {
        deny all;
    }

    # Статические файлы фронтенда
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси для API (без trailing slash в proxy_pass!)
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ВАЖНО: перезаписываем, а не добавляем ($proxy_add_x_forwarded_for).
        # Бэкенд считает лимит запросов по первому адресу из этого заголовка;
        # при добавлении посетитель мог подставить свой X-Forwarded-For и
        # получить бесконечный лимит, то есть тратить наш платный ключ без
        # ограничений. Перед nginx других прокси нет, поэтому $remote_addr —
        # настоящий адрес клиента, подделать его нельзя.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для длинных запросов RAG
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Кеширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
