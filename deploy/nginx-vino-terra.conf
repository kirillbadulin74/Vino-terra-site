# nginx-конфиг для vino-terra.ru
# Положить в /etc/nginx/sites-available/vino-terra.ru и включить:
#   sudo ln -s /etc/nginx/sites-available/vino-terra.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# СНАЧАЛА разверните с одним HTTP-блоком (ниже), получите сертификат certbot'ом —
# он сам допишет HTTPS-блок и редирект.

server {
    listen 80;
    listen [::]:80;
    server_name vino-terra.ru www.vino-terra.ru;

    root /opt/vinoterra/frontend;
    index index.html;

    # Статика сайта
    location / {
        try_files $uri $uri/ =404;
    }

    # Кеш для картинок/стилей (контент меняется редко)
    location ~* \.(jpg|jpeg|png|svg|webp|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # API Нейро-сомелье → локальный uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ответ RAG может занимать до минуты
        proxy_read_timeout 120s;
    }

    # Ограничение размера тела (вопрос ≤1200 символов, с запасом)
    client_max_body_size 64k;
}
